<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realmforge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<section id="menu-screen" class="screen"><div class="menu-card"><h1 class="title">REALMFORGE</h1><p class="tagline">choose your name and world</p><label class="field-label" for="username">NAME</label><input id="username" class="field-input" maxlength="16" placeholder="Wanderer"><label class="field-label" for="server-select">SERVER</label><select id="server-select" class="field-input"></select><button id="play-btn" class="play-btn" disabled>JOIN</button><p id="server-status" class="server-status"></p><p id="menu-error" class="menu-error"></p></div></section>
<section id="game-screen" class="screen hidden"><div id="hud"><div><span id="hud-world"></span> · <span id="hud-time">DAY</span> · <span id="hud-hp">HP 100/100</span> · <span id="hud-level">LV 1 · EXP 0/100</span></div><div id="hud-right"><span id="hud-players">1 online</span><button id="leave-btn">LEAVE</button></div></div><canvas id="game-canvas"></canvas><p class="controls-hint">A/D move · SPACE jump · M1 attack · F parry/block · 1-0 skills</p></section>
<script type="module" src="supabase-client.js"></script><script type="module" src="game.js"></script></body></html>
